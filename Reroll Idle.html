<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reroll Idle</title>
<style>
:root{--bg:#f4f5f9;--card:#fff;--tx:#1b1d2a;--mu:#6a6f85;--ac:#5b5bd6;--bd:#dcdfea;--ok:#1f9d55;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13141c;--card:#1d1f2b;--tx:#eceef8;--mu:#9a9fb8;--ac:#8b8bff;--bd:#2e3142;--ok:#4cd68a}}
:root[data-theme="dark"]{--bg:#13141c;--card:#1d1f2b;--tx:#eceef8;--mu:#9a9fb8;--ac:#8b8bff;--bd:#2e3142;--ok:#4cd68a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding:12px;max-width:760px;margin-inline:auto}
h1{font-size:20px;margin:4px 0}h2{font-size:14px;margin:16px 0 6px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px}
.top{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.big{font-size:24px;font-weight:700}.mu{color:var(--mu);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
button{font:inherit;background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 10px;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
.slot{text-align:center}.slot .e{font-size:28px}
.syn{display:flex;gap:8px;flex-wrap:wrap}.syn .card{flex:1;min-width:150px}
.on{border-color:var(--ok)}
.own{font-size:13px;display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--bd)}
</style>
</head>
<body>
<h1>⚔️ Reroll Idle <span class="mu">prototipo</span></h1>
<div class="card top"><div><div class="big" id="gold"></div><div class="mu" id="gps"></div></div><div style="text-align:right"><div id="rank"></div><div class="mu" id="lp"></div></div></div>
<p><button id="clk" data-c="1" style="width:100%;padding:14px;font-size:16px"></button></p>
<h2>Tienda</h2>
<div class="grid" id="shop"></div>
<p><button id="rr"></button></p>
<h2>Sinergias</h2><div class="syn" id="syn"></div>
<h2>Tu equipo</h2><div class="card" id="team"></div>
<h2>Prestigio</h2><div class="card"><div id="pres"></div><div class="grid" id="ups" style="margin-top:8px"></div></div>
<p class="mu"><button id="reset" style="background:var(--mu)">Borrar partida</button></p>
<script>
const NAMES=["Tuerquito","Engranajo","Pistón","Robotín","Brujilla","Runito","Nigromín","Astrólogo","Gruñón","Zarpas","Cuernito","Wyvernito"];
const EMO=["🔩","⚙️","🦾","🤖","🧙","🔮","💀","🌟","🐺","🐗","🦌","🐲"];
const TRAITS=["Mecánicos","Hechiceros","Bestias"];
const BC=[15,100,600,4000],BP=[.5,3.5,24,170];
const RANKS=["Hierro","Bronce","Plata","Oro","Platino","Esmeralda","Diamante","Maestro","Gran Maestro","Maetlo Chan"];
const UPS=[["Producción +25%",1],["Unidades -10% de coste",2],["Reroll a mitad de precio",3],["Empiezas con 100 de oro",5]];
const KEY="rerollidle_v1";
let S;
function fresh(keep){return{gold:(keep&&keep.ups.includes(3)?100:0)+20,total:0,own:NAMES.map(()=>[0,0,0]),shop:[],lp:keep?keep.lp:0,ups:keep?keep.ups:[],pres:keep?keep.pres:0,rr:0}}
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
if(!S||!S.own)S=fresh();
S.rr=S.rr||0;
const f=n=>n<1e3?n.toFixed(n<10?1:0):(()=>{const s=["","K","M","B","T","Qa"];let i=0;while(n>=1e3&&i<s.length-1){n/=1e3;i++}return n.toFixed(2)+s[i]})();
const has=i=>S.ups.includes(i);
const cnt=u=>S.own[u].reduce((a,b)=>a+b,0);
const units=()=>S.own.reduce((a,o)=>a+o[0]+o[1]+o[2],0);
function syn(){return TRAITS.map((_,t)=>{let c=0;for(let i=0;i<4;i++)if(cnt(t*4+i)>0)c++;return{c,m:c>=4?5:c>=3?2.5:c>=2?1.5:1}})}
function gps(){const sy=syn();let g=0;S.own.forEach((o,u)=>{const p=BP[u&3]*sy[u>>2].m;g+=p*(o[0]+o[1]*4+o[2]*16)});return g*(1+.02*S.lp)*(has(0)?1.25:1)}
const ucost=u=>BC[u&3]*Math.pow(1.15,cnt(u))*(has(1)?.9:1);
const rcost=()=>(5+units()*2+gps()*3)*Math.pow(1.15,S.rr)*(has(2)?.5:1);
function roll(){S.shop=[0,1,2,3,4].map(()=>Math.floor(Math.random()*12))}
if(S.shop.length!=5)roll();
function fuse(){S.own.forEach(o=>{for(let s=0;s<2;s++)while(o[s]>=3){o[s]-=3;o[s+1]++}})}
function buy(i){const u=S.shop[i];if(u==null)return;const c=ucost(u);if(S.gold<c)return;S.gold-=c;S.own[u][0]++;S.shop[i]=null;fuse();draw()}
function reroll(){const c=rcost();if(S.gold<c)return;S.gold-=c;S.rr++;roll();draw()}
const gain=()=>Math.floor(Math.sqrt(S.total/1e4));
const cv=()=>1+gps()*.1;
function click(){const g=cv();S.gold+=g;S.total+=g;draw()}
function prestige(){const g=gain();if(g<1)return;const k={lp:S.lp+g,ups:S.ups,pres:S.pres+1};S=fresh(k);roll();draw()}
function upg(i){const c=UPS[i][1];if(has(i)||S.lp<c)return;S.lp-=c;S.ups.push(i);if(i==3)S.gold+=100;draw()}
function draw(){
 const $=id=>document.getElementById(id);
 $("gold").textContent="🪙 "+f(S.gold);
 $("gps").textContent=f(gps())+" oro/s";
 $("clk").textContent="👆 Jugar partida (+"+f(cv())+" oro)";
 const pi=Math.min(S.pres,39);$("rank").textContent="Rango: "+RANKS[pi>>2]+" "+(4-(pi&3));
 $("lp").textContent=S.lp+" LP (+"+(S.lp*2)+"%)";
 $("shop").innerHTML=S.shop.map((u,i)=>u==null?'<div class="card slot mu">vendido</div>':`<div class="card slot"><div class="e">${EMO[u]}</div><b>${NAMES[u]}</b><div class="mu">${TRAITS[u>>2]}<br>${f(BP[u&3])}/s</div><button data-b="${i}" ${S.gold<ucost(u)?"disabled":""}>🪙 ${f(ucost(u))}</button></div>`).join("");
 $("rr").dataset.r=1;$("rr").textContent="🎲 Reroll (🪙 "+f(rcost())+")";$("rr").disabled=S.gold<rcost();
 $("syn").innerHTML=syn().map((s,t)=>`<div class="card ${s.m>1?"on":""}"><b>${TRAITS[t]}</b> ${s.c}/4<div class="mu">×${s.m} (2→×1.5, 3→×2.5, 4→×5)</div></div>`).join("");
 const tm=S.own.map((o,u)=>cnt(u)?`<div class="own"><span>${EMO[u]} ${NAMES[u]}</span><span>${"★".repeat(1)}${o[0]} · ★★${o[1]} · ★★★${o[2]}</span></div>`:"").join("");
 $("team").innerHTML=tm||'<span class="mu">Compra tu primera unidad en la tienda. 3 copias = 1 mejorada.</span>';
 const g=gain();
 $("pres").innerHTML=`Al subir de rango reinicias la partida y ganas <b>${g} LP</b> (mínimo 1, hace falta 100K de oro total). <button data-p="1" ${g<1?"disabled":""}>⬆️ Subir de rango</button>`;
 $("ups").innerHTML=UPS.map((u,i)=>`<div class="card slot"><div>${u[0]}</div><button data-u="${i}" ${has(i)||S.lp<u[1]?"disabled":""}>${has(i)?"Comprada":u[1]+" LP"}</button></div>`).join("");
}
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;
 if(t.dataset.b!=null)buy(+t.dataset.b);else if(t.dataset.r)reroll();else if(t.dataset.c)click();else if(t.dataset.p)prestige();else if(t.dataset.u!=null)upg(+t.dataset.u);
 else if(t.id=="reset"){if(!window._rs){window._rs=1;t.textContent="¿Seguro? Pulsa otra vez";setTimeout(()=>{window._rs=0;t.textContent="Borrar partida"},4000)}else{window._rs=0;t.textContent="Borrar partida";S=fresh();roll();try{localStorage.removeItem(KEY)}catch(e){}draw()}}});
let last=Date.now();
setInterval(()=>{const n=Date.now(),dt=(n-last)/1000;last=n;S.rr=Math.max(0,S.rr-dt/10);const g=gps()*dt;S.gold+=g;S.total+=g;draw()},250);
setInterval(()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},5000);
draw();
</script>
</body>
</html>
